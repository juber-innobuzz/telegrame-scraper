services:
  redis:
    image: redis:7-alpine
    container_name: telegram_auth_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - auth_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - auth_network

  auth_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram_auth_service
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - TELEGRAM_REQUEST_TIMEOUT=15
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - auth_network

volumes:
  auth_redis_data:
    driver: local

networks:
  auth_network:
    driver: bridge
